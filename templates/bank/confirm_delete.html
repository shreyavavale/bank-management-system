{% extends "bank/base.html" %}
{% block title %}Delete Confirmation{% endblock %}
{% block content %}
<div class="card shadow-sm border-danger form-card">
  <div class="card-header bg-danger text-white"><i class="bi bi-exclamation-triangle me-2"></i>Delete Confirmation</div>
  <div class="card-body">
    <p class="fs-5">Are you sure you want to delete <strong>{{ object_label }}</strong>?</p>
    <p class="text-danger">{{ warning }} This action cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Yes, Delete</button>
      <a href="{% url cancel_url %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
